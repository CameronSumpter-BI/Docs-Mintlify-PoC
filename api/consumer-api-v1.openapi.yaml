            example:
              messageCode: "quickstart-0002"
              clientID: "YOUR_CLIENT_ID"
              options:
                includeDrugDictionary: true
                predictiveNDCs: true
              drugParameters:
                ndc: "65862035790"
                quantity: 30
                bn: "clopidogrel"
              location:
                latitude: 47.6205
                longitude: -122.3493
                radius: 10
      responses:
        "200":
          $ref: "#/components/responses/PricingSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /drugprice/byndc/bypharmacies:
