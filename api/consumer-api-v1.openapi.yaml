# Buzz Health Consumer API v1: portal reference (Level 1: Public).
# Every example value is synthetic except public drug-catalog identifiers. Open questions carry [VERIFY|TBD|APPROVE V-NNN] markers.
# Keep platform extensions (x-mint, x-fern-*) out of this file; put them in overlays/.
openapi: 3.1.0
info:
  title: Consumer API
  version: "v1"
  summary: Real-time prescription pricing across nearby pharmacies.
  description: |
    The Consumer API returns prescription prices across pharmacies near a location, for display in your web or mobile app.

    - **Authentication:** request an access token from `POST /oauth2/token`, then send it as a bearer token with every pricing request.
    - **Pricing:** nine endpoints combine one drug identifier (NDC, drug form strength ID, or drug name ID) with one location method (ZIP code, coordinates, or a list of pharmacies).
    - **Envelope:** every response shares one envelope. Pricing data sits under `data.price`.

    Call the API from your server, never from a browser, so your credentials stay private.
  contact:
    name: Your Buzz Health account team [TBD V-017]
servers:
  - url: "{baseUrl}"
    description: Base URL provided by your account team [TBD V-004]
    variables:
      baseUrl:
        default: https://BUZZ_API_BASE_URL
        description: Replace with the base URL from your onboarding materials. [TBD V-004]
security:
  - bearerAuth: []
tags:
  - name: Authentication
    description: Get an access token for pricing requests.
  - name: Price by NDC
    description: Identify the drug by its 11-digit National Drug Code (NDC). The recommended starting point.
  - name: Price by drug form strength ID
    description: Identify the drug by a drug form strength ID returned in an earlier pricing response.
  - name: Price by drug name ID
    description: Identify the drug by drug name ID. Use only if your integration requires it.
paths:
  /oauth2/token:
    post:
      tags: [Authentication]
      operationId: getAccessToken
      summary: Get an access token
      description: |
        Exchange your client ID, user ID, and user secret for a bearer access token. Reuse the token until it expires, then request a new one.

        Send a non-empty `User-Agent` header with every request [VERIFY V-012].
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
            example:
              messageCode: "quickstart-0001"
              clientID: "YOUR_CLIENT_ID"
              userId: "YOUR_USER_ID"
              userSecret: "YOUR_USER_SECRET"
      responses:
        "200":
          description: Token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
              example:
                statuscode: "200 OK"
                status: "SUCCESS"
                method: "POST"
                timestamp: "2026-01-15 17:30:00"
                clientName: "ExamplePartner"
                messageCode: "quickstart-0001"
                data:
                  token:
                    access_token: "<access_token>"
                    expires_in: 86400
                    token_type: "Bearer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /drugprice/byndc/byzipcode:
    post:
      tags: ["Price by NDC"]
      operationId: priceNdcByZipCode
      summary: Price by NDC, near a ZIP code
      description: |
        Returns prices for one drug, identified by NDC, at pharmacies near a ZIP code. See [Pricing a Drug](/consumer-api/pricing-a-drug) to choose an endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PricingRequestBase"
                - type: object
                  required: [drugParameters, location]
                  properties:
                    drugParameters:
                      $ref: "#/components/schemas/DrugParametersNdc"
                    location:
                      $ref: "#/components/schemas/LocationZipCode"
            example:
              messageCode: "quickstart-0002"
              clientID: "YOUR_CLIENT_ID"
              options:
                includeDrugDictionary: true
                predictiveNDCs: true
              drugParameters:
                ndc: "65862035790"
                quantity: 30
                bn: "clopidogrel"
              location:
                zipCode: "98109"
                radius: 10
      responses:
        "200":
          $ref: "#/components/responses/PricingSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /drugprice/byndc/bylatlong:
    post:
      tags: ["Price by NDC"]
      operationId: priceNdcByLatLng
      summary: Price by NDC, near a latitude and longitude
      description: |
        Returns prices for one drug, identified by NDC, at pharmacies near a latitude and longitude. See [Pricing a Drug](/consumer-api/pricing-a-drug) to choose an endpoint.
      requestBody:
        required: true
        content:
