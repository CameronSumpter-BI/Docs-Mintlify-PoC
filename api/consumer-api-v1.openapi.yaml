      tags: ["Price by NDC"]
      operationId: priceNdcByPharmacies
      summary: Price by NDC, at specific pharmacies
      description: |
        Returns prices for one drug, identified by NDC, at pharmacies at specific pharmacies. See [Pricing a Drug](/consumer-api/pricing-a-drug) to choose an endpoint.
