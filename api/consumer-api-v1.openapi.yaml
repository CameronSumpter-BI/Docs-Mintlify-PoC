                      $ref: "#/components/schemas/LocationPharmacies"
            example:
              messageCode: "quickstart-0002"
              clientID: "YOUR_CLIENT_ID"
              options:
                includeDrugDictionary: true
                predictiveNDCs: true
              drugParameters:
                ndc: "65862035790"
                quantity: 30
                bn: "clopidogrel"
              location:
                npis: ["1234567893"]
      responses:
        "200":
          $ref: "#/components/responses/PricingSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
