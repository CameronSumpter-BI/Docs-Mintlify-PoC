<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="704" viewBox="0 0 1200 704" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="integration-architecture-title integration-architecture-desc">
      <title id="integration-architecture-title">How a Consumer API integration fits together</title>
      <desc id="integration-architecture-desc">Architecture diagram showing an end user's web or mobile app talking to your front end, your front end talking to your server, and your server calling the Consumer API's token and pricing endpoints server-to-server over HTTPS.</desc>
      <defs>
        <style>
          @import url('https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
          .title   { font: 400 32px 'Lato', sans-serif; fill: #262626; }
          .name    { font: 600 20px 'Geist', sans-serif; fill: #262626; }
          .sub     { font: 600 16px 'Geist', sans-serif; fill: #262626; }
          .body    { font: 400 16px 'Geist', sans-serif; fill: #525252; }
          .eyebrow { font: 500 16px 'Geist Mono', monospace; letter-spacing: 0.08em; fill: #6B6B6B; }
          .aside   { font: italic 400 20px 'Lato', sans-serif; fill: #262626; }
          .m       { fill: #f5f5f5; }
          .c-link  { fill: #00768D; }
        </style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525252"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#C98A00"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00768D"/></marker>
        <!-- Two-way connectors: the same head at both ends -->
        <marker id="arrow-both" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#525252"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Title -->
      <text class="title" x="40" y="56">How a Consumer API integration fits together</text>

      <!-- =================================================================
           ZONES — hairline only; nothing crosses their labels
           ================================================================= -->
      <g fill="none" stroke="rgba(38,38,38,0.16)" stroke-width="0.8">
        <rect x="40" y="96" width="240" height="536" rx="8"/>
        <rect x="320" y="96" width="360" height="536" rx="8"/>
        <rect x="840" y="96" width="320" height="536" rx="8"/>
      </g>
      <text class="eyebrow" x="56" y="124">END USER</text>
      <text class="eyebrow" x="336" y="124">YOUR PLATFORM</text>
      <text class="eyebrow" x="856" y="124">BUZZ HEALTH</text>

      <!-- Security boundary: Your server + its Consumer API connections -->
      <rect x="376" y="360" width="768" height="248" rx="8" fill="none" stroke="rgba(201,138,0,0.60)" stroke-width="1" stroke-dasharray="4,4"/>
      <g>
        <rect class="m" x="696" y="348" width="308" height="24" rx="2"/>
        <text class="eyebrow" x="704" y="366" style="fill:#946500">SERVER-TO-SERVER OVER HTTPS</text>
      </g>

      <!-- Consumer API container — painted with the zones so connectors can reach its endpoints -->
      <rect x="872" y="376" width="256" height="216" rx="8" fill="#f5f5f5"/>
      <rect x="872" y="376" width="256" height="216" rx="8" fill="rgba(38,38,38,0.03)" stroke="rgba(38,38,38,0.30)" stroke-width="1"/>
      <text class="name" x="1000" y="408" text-anchor="middle">Consumer API</text>

      <!-- =================================================================
           CONNECTORS — drawn before nodes
           ================================================================= -->
      <!-- App ↔ Front end -->
      <line x1="264" y1="240" x2="400" y2="240" stroke="#525252" stroke-width="1.2" marker-start="url(#arrow-both)" marker-end="url(#arrow-both)"/>
      <g>
        <rect class="m" x="284" y="184" width="96" height="48" rx="2"/>
        <text class="body" x="332" y="202" text-anchor="middle"><tspan x="332">Search and</tspan><tspan x="332" dy="20">results</tspan></text>
      </g>

      <!-- Front end ↔ Server -->
      <line x1="520" y1="280" x2="520" y2="420" stroke="#525252" stroke-width="1.2" marker-start="url(#arrow-both)" marker-end="url(#arrow-both)"/>
      <g>
        <rect class="m" x="528" y="308" width="184" height="28" rx="2"/>
        <text class="body" x="536" y="326">Drug, quantity, location</text>
      </g>

      <!-- Server → Token endpoint -->
      <line x1="640" y1="448" x2="896" y2="448" stroke="#00768D" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <g>
        <rect class="m" x="696" y="392" width="120" height="48" rx="2"/>
        <text class="body c-link" x="756" y="410" text-anchor="middle"><tspan x="756">Credentials →</tspan><tspan x="756" dy="20">access token</tspan></text>
      </g>

      <!-- Server → Pricing endpoints -->
      <line x1="640" y1="552" x2="896" y2="552" stroke="#00768D" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <g>
        <rect class="m" x="660" y="476" width="192" height="68" rx="2"/>
        <text class="body c-link" x="756" y="494" text-anchor="middle"><tspan x="756">Bearer token +</tspan><tspan x="756" dy="20">pricing request →</tspan><tspan x="756" dy="20">pharmacy prices (JSON)</tspan></text>
      </g>

      <!-- =================================================================
           NODES
           ================================================================= -->
      <!-- Web or mobile app (input) -->
      <rect x="56" y="176" width="208" height="128" rx="6" fill="#f5f5f5"/>
      <rect x="56" y="176" width="208" height="128" rx="6" fill="rgba(82,82,82,0.10)" stroke="#6B6B6B" stroke-width="1"/>
      <text class="name" x="160" y="212" text-anchor="middle">Web or mobile app</text>
      <text class="body" x="160" y="240" text-anchor="middle"><tspan x="160">A person searches for</tspan><tspan x="160" dy="20">a drug and compares</tspan><tspan x="160" dy="20">pharmacy prices</tspan></text>

      <!-- Your front end -->
      <rect x="400" y="200" width="240" height="80" rx="6" fill="#ffffff" stroke="#262626" stroke-width="1"/>
      <text class="name" x="520" y="247" text-anchor="middle">Your front end</text>

      <!-- Your server -->
      <rect x="400" y="420" width="240" height="160" rx="6" fill="#ffffff" stroke="#262626" stroke-width="1"/>
      <text class="name" x="520" y="484" text-anchor="middle">Your server</text>
      <text class="body" x="520" y="512" text-anchor="middle"><tspan x="520">Stores API credentials</tspan><tspan x="520" dy="20">Caches the access token</tspan></text>

      <!-- Endpoint groups inside the Consumer API container -->
      <rect x="896" y="424" width="208" height="48" rx="6" fill="#ffffff" stroke="rgba(38,38,38,0.30)" stroke-width="1"/>
      <text class="sub" x="1000" y="454" text-anchor="middle">Token endpoint</text>

      <rect x="896" y="528" width="208" height="48" rx="6" fill="#ffffff" stroke="rgba(38,38,38,0.30)" stroke-width="1"/>
      <text class="sub" x="1000" y="558" text-anchor="middle">Pricing endpoints (9)</text>

      <!-- Caption -->
      <text class="aside" x="40" y="672">Your server calls the Consumer API with the credentials Buzz Health provides.</text>
    </svg>
